<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Cà phê">
  <defs>
    <linearGradient id="bgc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b892"/>
      <stop offset="1" stop-color="#b98e5f"/>
    </linearGradient>
    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3418"/>
      <stop offset="1" stop-color="#3a2010"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgc)"/>
  <!-- wood planks -->
  <g stroke="#9d7444" stroke-width="3" opacity="0.35">
    <line x1="0" y1="170" x2="1200" y2="170"/><line x1="0" y1="500" x2="1200" y2="500"/>
  </g>
  <!-- saucer -->
  <ellipse cx="600" cy="560" rx="230" ry="46" fill="#efe7d8"/>
  <ellipse cx="600" cy="556" rx="180" ry="34" fill="#e2d7c2"/>

  <!-- glass -->
  <g>
    <path d="M470 210 L730 210 L700 545 Q600 575 500 545 Z" fill="#eef3f6" opacity="0.55"/>
    <!-- coffee -->
    <path d="M486 320 L714 320 L700 540 Q600 568 500 540 Z" fill="url(#coffee)"/>
    <!-- salted cream/foam layer -->
    <path d="M478 300 L722 300 L714 320 L486 320 Z" fill="#f0e2cf"/>
    <ellipse cx="600" cy="300" rx="122" ry="16" fill="#f7efe0"/>
    <!-- ice cubes -->
    <g fill="#ffffff" opacity="0.5">
      <rect x="520" y="345" width="46" height="46" rx="8" transform="rotate(12 543 368)"/>
      <rect x="600" y="360" width="50" height="50" rx="8" transform="rotate(-10 625 385)"/>
      <rect x="560" y="410" width="42" height="42" rx="8" transform="rotate(20 581 431)"/>
    </g>
    <!-- glass highlight -->
    <path d="M498 235 L512 235 L500 520 L488 515 Z" fill="#ffffff" opacity="0.35"/>
  </g>
  <!-- straw -->
  <rect x="648" y="170" width="16" height="200" rx="8" fill="#e05a5a" transform="rotate(10 656 270)"/>

  <!-- steam-ish sparkle removed; add coffee beans -->
  <g fill="#4a2c14">
    <ellipse cx="330" cy="560" rx="20" ry="13" transform="rotate(30 330 560)"/>
    <ellipse cx="360" cy="575" rx="20" ry="13" transform="rotate(-20 360 575)"/>
    <ellipse cx="870" cy="565" rx="20" ry="13" transform="rotate(15 870 565)"/>
  </g>

  <g>
    <rect x="40" y="600" width="230" height="46" rx="10" fill="rgba(40,25,12,0.6)"/>
    <text x="60" y="630" font-family="system-ui, Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="700">Cà phê muối</text>
  </g>
</svg>
