<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Quán đặc sản Lào">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2b22"/>
      <stop offset="1" stop-color="#241a14"/>
    </linearGradient>
    <radialGradient id="plate" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fbfbf9"/>
      <stop offset="1" stop-color="#e5e3dc"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg3)"/>
  <!-- steam -->
  <g stroke="#ffffff" stroke-width="7" opacity="0.12" fill="none" stroke-linecap="round">
    <path d="M540 210 q -30 -40 0 -80 q 30 -40 0 -80"/>
    <path d="M660 210 q -30 -40 0 -80 q 30 -40 0 -80"/>
  </g>

  <!-- big plate -->
  <ellipse cx="600" cy="400" rx="330" ry="150" fill="url(#plate)"/>
  <ellipse cx="600" cy="392" rx="270" ry="118" fill="#f0eee6"/>

  <!-- grilled chicken (roast) -->
  <g>
    <ellipse cx="600" cy="392" rx="180" ry="92" fill="#a5622c"/>
    <ellipse cx="600" cy="380" rx="150" ry="72" fill="#b9743a"/>
    <ellipse cx="560" cy="372" rx="55" ry="34" fill="#c9853f"/>
    <ellipse cx="655" cy="378" rx="60" ry="36" fill="#c9853f"/>
    <!-- drumsticks -->
    <g fill="#8a4f22">
      <rect x="455" y="415" width="70" height="18" rx="9" transform="rotate(18 490 424)"/>
      <rect x="690" y="415" width="70" height="18" rx="9" transform="rotate(-18 725 424)"/>
    </g>
    <!-- herbs -->
    <g fill="#4f7d3a">
      <circle cx="600" cy="352" r="10"/><circle cx="580" cy="360" r="8"/>
      <circle cx="620" cy="360" r="8"/><circle cx="600" cy="368" r="7"/>
    </g>
    <!-- shine -->
    <ellipse cx="540" cy="358" rx="30" ry="12" fill="#e0a55f" opacity="0.6"/>
  </g>

  <!-- chopsticks -->
  <g stroke="#c9a06a" stroke-width="8" stroke-linecap="round">
    <line x1="250" y1="250" x2="470" y2="360"/>
    <line x1="270" y1="230" x2="490" y2="345"/>
  </g>

  <!-- Beerlao-style can -->
  <g transform="translate(930,330)">
    <rect x="-42" y="-70" width="84" height="150" rx="12" fill="#e9c74a"/>
    <rect x="-42" y="-70" width="84" height="36" rx="12" fill="#d8b431"/>
    <rect x="-30" y="10" width="60" height="34" rx="5" fill="#0f5aa0"/>
    <text x="0" y="33" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">BIA</text>
    <ellipse cx="0" cy="-70" rx="42" ry="10" fill="#c9a52a"/>
  </g>

  <!-- caption chip -->
  <g>
    <rect x="40" y="600" width="380" height="44" rx="10" fill="rgba(0,0,0,0.5)"/>
    <text x="60" y="628" font-family="system-ui, Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="700">Đặc sản Lào — Đồng Hới</text>
  </g>
</svg>
