<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Cung đường ven biển">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd28a"/>
      <stop offset="0.4" stop-color="#ffe1b0"/>
      <stop offset="1" stop-color="#cdeef2"/>
    </linearGradient>
    <linearGradient id="sea2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f6f9e"/>
      <stop offset="1" stop-color="#3d9ec9"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a86a"/>
      <stop offset="1" stop-color="#b08f52"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8bd85"/>
      <stop offset="1" stop-color="#c2a267"/>
    </linearGradient>
    <linearGradient id="road2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5560"/>
      <stop offset="1" stop-color="#333b44"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#sky2)"/>
  <!-- sun low -->
  <circle cx="300" cy="150" r="60" fill="#fff3d0" opacity="0.95"/>
  <circle cx="300" cy="150" r="42" fill="#ffdf94"/>

  <!-- sea -->
  <rect x="0" y="235" width="1200" height="180" fill="url(#sea2)"/>
  <g stroke="#ffffff" stroke-width="3" opacity="0.3">
    <line x1="120" y1="300" x2="260" y2="300"/>
    <line x1="500" y1="330" x2="640" y2="330"/>
    <line x1="880" y1="285" x2="1010" y2="285"/>
  </g>
  <!-- sun glitter -->
  <g stroke="#ffe9b0" stroke-width="3" opacity="0.6">
    <line x1="280" y1="260" x2="320" y2="260"/>
    <line x1="270" y1="285" x2="330" y2="285"/>
    <line x1="285" y1="310" x2="315" y2="310"/>
  </g>

  <!-- far headland -->
  <path d="M0 415 Q 260 300 520 400 T 1200 380 L1200 415 Z" fill="url(#hill2)" opacity="0.9"/>

  <!-- big golden headland right -->
  <path d="M1200 675 L1200 300 Q 980 330 900 470 Q 840 585 700 675 Z" fill="url(#hill)"/>
  <!-- left headland -->
  <path d="M0 675 L0 430 Q 160 440 250 520 Q 330 600 300 675 Z" fill="url(#hill2)"/>

  <!-- sweeping cliff road (S-curve) -->
  <path d="M280 675
           C 360 560, 250 500, 470 470
           C 690 440, 640 560, 760 560
           C 900 560, 900 620, 980 675 Z"
        fill="url(#road2)"/>
  <!-- guardrail (white posts) -->
  <path d="M300 665 C 380 555, 275 512, 480 482"
        fill="none" stroke="#f4f6f4" stroke-width="4" opacity="0.85"/>
  <!-- center dashed line -->
  <path d="M470 640 C 520 560, 470 520, 560 512 C 700 500, 700 575, 800 590"
        fill="none" stroke="#ffd23f" stroke-width="6" stroke-dasharray="22 22" opacity="0.9"/>
  <!-- a little car -->
  <g transform="translate(560,545) rotate(-8)">
    <rect x="-16" y="-9" width="32" height="16" rx="4" fill="#eef2f5"/>
    <rect x="-9" y="-14" width="18" height="8" rx="3" fill="#dbe3ea"/>
  </g>

  <!-- caption chip -->
  <g>
    <rect x="40" y="600" width="330" height="44" rx="10" fill="rgba(20,30,40,0.55)"/>
    <text x="60" y="628" font-family="system-ui, Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="700">Cung đường ven biển</text>
  </g>
</svg>
