name: Deploy web bản đồ (GitHub Pages)

on:
  push:
    branches: [claude/facebook-fanpage-review-jln92n]
    paths: ["docs/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages (tự bật nếu chưa bật)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload thư mục docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
