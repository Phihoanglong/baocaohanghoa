name: fb-api-check
on:
  push:
    branches: [claude/facebook-fanpage-review-jln92n]
    paths: [".github/workflows/fb-api-check.yml"]
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Try Facebook Graph API on the group
        run: |
          set +e
          SHARE="https://www.facebook.com/share/g/194vhuqsrX/?mibextid=wwXIfr"
          UAG="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"

          echo "############ 1. Resolve share link -> group id ############"
          curl -s -L -A "$UAG" "$SHARE" -o page.html -w "final: %{url_effective}\n"
          GID=$(grep -o -E 'groups(/|\\/)[0-9]{6,}' page.html | head -1 | grep -o -E '[0-9]{6,}')
          echo "GROUP ID = ${GID:-<not found>}"

          if [ -z "$GID" ]; then
            echo "next-param dump:"; grep -o -E 'next=[^"&]{1,300}' page.html | head -3
          fi

          echo ""
          echo "############ 2. Graph API: group object (NO token) ############"
          curl -s "https://graph.facebook.com/v20.0/${GID}" ; echo

          echo "############ 3. Graph API: group FEED (NO token) ############"
          curl -s "https://graph.facebook.com/v20.0/${GID}/feed?limit=5" ; echo

          echo "############ 4. Graph API with a fake/empty token (show error) ############"
          curl -s "https://graph.facebook.com/v20.0/${GID}/feed?access_token=INVALID" ; echo

          echo "############ 5. Public oEmbed attempt ############"
          curl -s "https://graph.facebook.com/v20.0/oembed_post?url=${SHARE}" ; echo

          echo "=================== DONE ==================="
          true
